<!DOCTYPE html>
<html>
<head>
    <title>Edit Reservation</title>
</head>


<script>
document.addEventListener("DOMContentLoaded", function () {
    // Today's date in the user's local timezone
    const now = new Date();
    const today = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
    ].join("-");

    // Issue and edit expected return dates
    document.querySelectorAll(
        'input[type="date"][name="return_date"]'
    ).forEach(function (input) {
        input.min = today;
    });

    // Reserve and edit reservation expiry dates
    document.querySelectorAll(
        'input[type="date"][name="reserved_until"]'
    ).forEach(function (input) {
        input.min = today;
    });
});
</script>



<body style="font-family:Arial;padding:30px;">

<a href="/reserve">
⬅ Back
</a>

<h2>Edit Reservation Date</h2>

<form method="POST">

<input
    type="date"
    name="reserved_until"
    lang="en-GB"
    value="{{ reservation.reserved_until }}"
    required
>


<br><br>

<button>
Save
</button>

</form>

<script src="{{ url_for('static', filename='date-format.js') }}"></script>

</body>
</html>
