<!DOCTYPE html>
<html>
<head>
    <title>Return Books</title>

    <link rel="icon" type="image/svg+xml"
      href="{{ url_for('static', filename='favicon.svg') }}">

      

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
        }

        /* SIDEBAR (SAME AS YOUR OTHER PAGES) */
        .sidebar {
            width: 220px;
            background: #111;
            color: white;
            padding: 20px;
            height: 100vh;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        input, select {
            padding: 10px;
            margin: 5px;
            width: 250px;
        }

        .book-hover {
    position: relative;
    display: inline-block;
    color: #2563eb;
    font-weight: 600;
    cursor: help;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
}


.book-tooltip {
    display: none;
    position: fixed;
    width: 270px;
    max-width: 75vw;
    max-height: 70vh;
    overflow-y: auto;
    padding: 14px;
    background: #ffffff;
    color: #222222;
    border: 1px solid #dddddd;
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
    z-index: 99999;
    font-size: 13px;
    font-weight: normal;
    line-height: 1.7;
    white-space: normal;
    overflow-wrap: anywhere;
}

.book-hover:hover .book-tooltip,
.book-hover:focus-within .book-tooltip {
    display: block;
}

.tooltip-cover {
    display: block;
    max-width: 100px;
    max-height: 130px;
    object-fit: contain;
    margin: 0 auto 10px;
    border-radius: 4px;
}





        .box {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .student {
            padding: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        .list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .error {
            color: red;
        }
    </style>

    <script>
        let issues = {{ issues | tojson }};
        let books = {{ books | tojson }};

        // RETURN BY BOOK ID
        function showBook() {
            let id = document.getElementById("book_id").value;
            let box = document.getElementById("book_info");

            let found = issues.find(i => i.book_id === id && i.returned === false);

            if (found) {
                box.innerHTML = `
                    <b>${found.book_name}</b><br>
                    Student: ${found.student}<br>
                    Class: ${found.class}<br>
                    Issued: ${found.issue_date}
                `;
            } else {
                box.innerHTML = "No active issue found";
            }
        }

        // LOAD BORROWERS BY CLASS (ONLY BORROWED ONES)
        
function loadBorrowers() {
    let className = document.getElementById("class").value;
    let container = document.getElementById("borrowers");
    let search = document.getElementById("borrower_search");

    container.innerHTML = "";
    search.value = "";

    if (!className) return;

    let filtered = issues.filter(
        i => i.class === className && i.returned === false
            && i.status !== "reserved"
            && i.status !== "expired"
    );

    filtered.forEach(i => {
        let div = document.createElement("div");
        div.className = "student";

        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.name = "students";
        checkbox.value = i.student;


        let label = document.createElement("span");
label.append(document.createTextNode(` ${i.student} (`));

let bookId = document.createElement("span");
bookId.className = "book-hover";
bookId.textContent = i.book_id;

let tooltip = document.createElement("span");
tooltip.className = "book-tooltip";

let book = books.find(b => b.id === i.book_id);

if (book) {
    if (book.cover) {
        let cover = document.createElement("img");
        cover.src = book.cover;
        cover.alt = book.name || "Book cover";
        cover.className = "tooltip-cover";
        tooltip.appendChild(cover);
    }

    let details = [
        ["Book Name", book.name],
        ["Author", book.author],
        ["Publisher", book.publisher],
        ["Year Published", book.year_published],
        ["ISBN", book.isbn],
        ["Price", book.price],
        ["Subtitle", book.subtitle]
    ];

    details.forEach(([title, value]) => {
        if (value !== undefined && value !== null && value !== "") {
            let line = document.createElement("div");
            line.textContent = `${title}: ${value}`;
            tooltip.appendChild(line);
        }
    });
} else {
    tooltip.textContent = "Book details unavailable";
}

bookId.appendChild(tooltip);
label.appendChild(bookId);
label.append(document.createTextNode(")"));




        div.dataset.search =
            `${i.student} ${i.book_id}`.toLowerCase();

        div.appendChild(checkbox);
        div.appendChild(label);
        container.appendChild(div);
    });

    filterBorrowers();
}

function filterBorrowers() {
    let query = document.getElementById("borrower_search")
        .value.trim().toLowerCase();

    document.querySelectorAll("#borrowers .student").forEach(row => {
        row.style.display =
            row.dataset.search.includes(query) ? "" : "none";
    });
}


document.addEventListener("mouseover", function (event) {
    const bookId = event.target.closest(".book-hover");
    if (!bookId) return;

    const popup = bookId.querySelector(".book-tooltip");
    if (!popup) return;

    popup.style.display = "block";

    const rect = bookId.getBoundingClientRect();
    const popupWidth = popup.offsetWidth;
    const popupHeight = popup.offsetHeight;

    let left = rect.right + 10;
    let top = rect.top;

    // If there isn't room on the right, show it on the left.
    if (left + popupWidth > window.innerWidth - 10) {
        left = rect.left - popupWidth - 10;
    }

    // Keep the popup inside the visible screen.
    left = Math.max(10, Math.min(left, window.innerWidth - popupWidth - 10));
    top = Math.max(10, Math.min(top, window.innerHeight - popupHeight - 10));

    popup.style.left = `${left}px`;
    popup.style.top = `${top}px`;
});

document.addEventListener("mouseout", function (event) {
    const bookId = event.target.closest(".book-hover");
    if (!bookId || bookId.contains(event.relatedTarget)) return;

    const popup = bookId.querySelector(".book-tooltip");
    if (popup) popup.style.display = "";
});





        // VALIDATION
        function validateBookReturn() {
            let id = document.getElementById("book_id").value;
            if (!id) {
                document.getElementById("error1").innerText = "Please enter book ID";
                return false;
            }
            return true;
        }

        function validateClassReturn() {
            let className = document.getElementById("class").value;
            let checked = document.querySelectorAll('input[name="students"]:checked');

            if (!className || checked.length === 0) {
                document.getElementById("error2").innerText = "Select class and students";
                return false;
            }
            return true;
        }
    </script>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>LiBMeM</h2>
    <hr>
    <a href="/dashboard">Dashboard</a>
    <p>
    <a href="/excel_import" style="color:white;">
        From Excel
    </a>
</p>
    <a href="/books">Add Books</a>
    <a href="/students">Add Students</a>
    <a href="/issue">Issue Books</a>
    <a href="/return">Return Books</a>
    <p><a href="/history" style="color:white; text-decoration:none;">History</a></p>
    <p><a href="/reserve" style="color:white;">Reserve Books</a></p>
    <div style="
    position:absolute;
    bottom:20px;
    left:20px;
    color:gray;
    font-size:13px;
    line-height:1.6;
">
    <div>v2.321.18</div>
    <div>By Tanush</div>
</div>
   
</div>

<!-- MAIN -->
<div class="main">

    <h2>Return Books</h2>

    <!-- BY BOOK ID -->
    <div class="box">
        <h3>Return by Book ID</h3>

        <form method="POST" action="/return_book" onsubmit="return validateBookReturn()">
            <input type="text" name="book_id" id="book_id"
                   placeholder="Enter Book No (S0001)" onkeyup="showBook()">

            <div id="book_info" style="margin-top:10px;"></div>

            <button type="submit">Return</button>
        </form>

        <p id="error1" class="error"></p>
    </div>

    <!-- BY CLASS -->
    <div class="box">
        <h3>Return by Class</h3>

        <form method="POST" action="/return_class" onsubmit="return validateClassReturn()">

            <select id="class" name="class_name" onchange="loadBorrowers()">
                <option value="">Select Class</option>
                {% for c in classes %}
                    <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>

            
<input
    type="search"
    id="borrower_search"
    placeholder="Search students or book IDs"
    oninput="filterBorrowers()"
    autocomplete="off"
>

<div class="list" id="borrowers"></div>



           

            <button type="submit">Return Selected</button>
        </form>

        <p id="error2" class="error"></p>
    </div>

</div>

</body>
</html>
